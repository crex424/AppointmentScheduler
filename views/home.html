<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Scheduler</title>
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <form action="/confirm" method="get">
    <h1>Appointment Scheduler</h1>

    <h2>Book an Appointment</h2>

    <label for="fname">First Name</label>
    <input type="text" id="fname" name="fname" placeholder="Jane">
    <span id="err-fname" class="error">First name is required</span>

    <label for="lname">Last Name</label>
    <input type="text" id="lname" name="lname" placeholder="Doe">
    <span id="err-lname" class="error">Last name is required</span>

    <label for="date">Meeting Date</label>
    <input type="date" id="date" name="date" placeholder="mm/dd/yyyy">

    <label for="time">Meeting Time</label>
    <input type="time" id="time" name="time" placeholder="--:--:--">

    <button type="submit">Book Appointment</button>
  </form>
</body>
</html>
